# Base de dados PostgreSQL da Matriz (D02).
# Os dados ficam no volume "matriz-dados" e sobrevivem a reinícios.
# As credenciais vêm de backend/.env (copiar de backend/.env.example).
services:
  postgres:
    image: postgres:17
    container_name: matriz-postgres
    env_file: backend/.env
    # Só neste computador (127.0.0.1): a base de dados não fica acessível a partir da rede.
    # Revisão de segurança da Ficha PL 04 (S1, docs/quality-security-review.md).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - matriz-dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  matriz-dados:
