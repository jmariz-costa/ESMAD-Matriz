# Configuração do Backend da Matriz.
# Os valores sensíveis vêm de variáveis de ambiente ou de backend/.env (ver .env.example).

# HTTP: a API fica sob /api; o health check em /q/health
quarkus.http.port=8081
quarkus.rest.path=/api

# Base de dados (D02). Em testes não há URL: o Quarkus Dev Services cria um PostgreSQL temporário (D11).
# MATRIZ_DB_HOST só é preciso dentro do Docker, onde a BD não está em localhost (Ficha PL 05).
quarkus.datasource.db-kind=postgresql
%dev,prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${MATRIZ_DB_HOST:localhost}:5432/${POSTGRES_DB}
%dev,prod.quarkus.datasource.username=${POSTGRES_USER}
%dev,prod.quarkus.datasource.password=${POSTGRES_PASSWORD}
%dev.quarkus.datasource.devservices.enabled=false
%test.quarkus.datasource.devservices.image-name=postgres:17

# Esquema criado e evoluído só pelas migrations Flyway; o Hibernate não altera tabelas
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=none

# Administrador (D07) e dados de demonstração
matriz.admin.nome=${MATRIZ_ADMIN_NOME:Administrador}
matriz.admin.email=${MATRIZ_ADMIN_EMAIL:}
matriz.admin.password=${MATRIZ_ADMIN_PASSWORD:}
matriz.seed.demo=${MATRIZ_SEED_DEMO:false}
matriz.seed.demo-password=${MATRIZ_DEMO_PASSWORD:}
%test.matriz.seed.demo=false

# Sessão (D06): o cookie só leva Secure quando a aplicação é servida por HTTPS
matriz.sessao.cookie-seguro=${MATRIZ_COOKIE_SEGURO:false}

# Pedidos JSON com campos desconhecidos são recusados (additionalProperties: false no contrato)
quarkus.jackson.fail-on-unknown-properties=true
