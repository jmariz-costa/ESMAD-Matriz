# Pipeline de integração contínua da Matriz (Ficha PL 05, Exercício 4).
#
#   backend-tests ──┐
#                   ├──> docker-build (imagens, compose, smoke tests e E2E)
#   frontend-checks ┘
#
# Não usa segredos: as palavras-passe da stack de teste são geradas em cada execução e
# desaparecem com a máquina do runner (decisão 4a).
# As actions são referidas pelo SHA do commit, com a versão em comentário (decisão 1a).
name: CI Matriz

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas: só ler o código
permissions:
  contents: read

# Um push novo no mesmo branch cancela a execução anterior, que já está desatualizada
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Testes Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Os testes de integração usam um PostgreSQL temporário (Quarkus Dev Services), com o Docker do runner
      - name: Executar testes
        run: ./mvnw -B test

      - name: Guardar relatórios dos testes em caso de falha
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorios-backend
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend-checks:
    name: Testes e Build Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Análise estática (oxlint)
        run: npm run lint

      - name: Executar testes
        run: npm test

      - name: Construir frontend (inclui tsc -b)
        run: npm run build

      # Falha com vulnerabilidades altas ou críticas nas dependências (decisão 2a)
      - name: Auditar dependências
        run: npm audit --audit-level=high

  docker-build:
    name: Docker Build, Smoke Tests e E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Só corre depois de os testes do Backend e do Frontend passarem (quality gate)
    needs:
      - backend-tests
      - frontend-checks
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # backend/.env a partir do modelo, com palavras-passe novas; ::add-mask:: esconde-as nos logs
      - name: Preparar configuração temporária
        run: |
          cp backend/.env.example backend/.env
          for variavel in POSTGRES_PASSWORD MATRIZ_ADMIN_PASSWORD MATRIZ_DEMO_PASSWORD; do
            valor="$(openssl rand -hex 24)"
            echo "::add-mask::${valor}"
            sed -i "s|^${variavel}=.*|${variavel}=${valor}|" backend/.env
          done
          # O E2E entra com uma conta de demonstração: passa a palavra-passe aos steps seguintes
          grep '^MATRIZ_DEMO_PASSWORD=' backend/.env >> "$GITHUB_ENV"

      - name: Validar Docker Compose
        run: docker compose config -q

      - name: Construir imagens
        run: docker compose build

      - name: Executar aplicação
        run: docker compose up -d --wait --wait-timeout 180

      - name: Smoke tests
        run: |
          docker compose ps
          # Backend e ligação à base de dados (o Backend não publica porta no host)
          docker compose exec -T backend curl -fsS http://localhost:8081/q/health/ready
          # Frontend servido pelo nginx
          curl -fsS -o /dev/null http://127.0.0.1:8090/
          # /api chega ao Backend através do nginx: sem sessão responde 401
          codigo="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/api/auth/me)"
          test "$codigo" = "401" || { echo "Esperado 401 em /api/auth/me, recebido $codigo"; exit 1; }
          echo "Smoke tests aprovados"

      - name: Configurar Node.js 24 (E2E)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Playwright e Firefox
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps firefox

      - name: Executar testes E2E
        working-directory: frontend
        env:
          MATRIZ_E2E_URL: http://127.0.0.1:8090
        run: npm run e2e

      - name: Consultar logs em caso de falha
        if: failure()
        run: docker compose logs --tail=200

      - name: Guardar relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: relatorio-e2e
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

      - name: Limpar ambiente
        if: always()
        run: docker compose down -v
