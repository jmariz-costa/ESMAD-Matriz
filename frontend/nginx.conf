# nginx do Frontend da Matriz (Ficha PL 05, decisão 1a).
# Faz o mesmo que o proxy do Vite em desenvolvimento: o browser só fala com esta origem,
# por isso o cookie de sessão funciona sem CORS (vite.config.ts).
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # API: "backend" é o nome do serviço do Backend na rede Docker
    location /api/ {
        proxy_pass http://backend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rotas do React Router (por exemplo /projetos/<id>): devolvem o index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
